name: Pages preview (review branches only)

# Lives only on preview/* branches, never on main. Deploys the committed site/ plus cloudflare/_headers and _redirects
# to a Cloudflare Pages PREVIEW (branch alias), never production. Production branch of the project is main.
on:
  push:
    branches: ["preview/**"]

permissions:
  contents: read

concurrency:
  group: pages-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble out/
        run: |
          mkdir out && cp -r site/. out/
          cp cloudflare/_redirects cloudflare/_headers out/
          mkdir -p out/.well-known && cp cloudflare/security.txt out/.well-known/security.txt
          if [ -d out/functions ]; then rm -rf functions; mv out/functions functions; fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Deploy preview (never main)
        run: |
          BR="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          case "$BR" in main|"") echo "refusing production branch"; exit 1;; esac
          npx --yes wrangler@4 pages deploy out --project-name=stationery-drop-watch --branch="$BR" --commit-dirty=true
