name: Check stock and deploy site

on:
  schedule:
    - cron: "17,47 * * * *"  # twice an hour, off the busy :00 slot (GitHub was dropping most :00 runs)
  workflow_dispatch:
    inputs:
      test_ping:
        description: "Send a test in-stock ping to the drop-alert webhook (no real alert)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write    # commit data/ changes
  pages: write       # deploy to GitHub Pages
  id-token: write

concurrency:
  group: drop-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Same polite checker as local: robots.txt respected, 2.5 s/host, one worker per host.
      - name: Run stock checker
        run: python scripts/checker.py

      - name: Build site
        run: python scripts/build_site.py

      # Find this run's new in_stock changes before the commit moves HEAD.
      - name: Collect new in-stock changes
        id: fresh
        run: echo "count=$(python scripts/new_in_stock.py /tmp/new_in_stock.json)" >> "$GITHUB_OUTPUT"

      - name: Commit data changes (skip timestamp-only updates)
        run: |
          if python scripts/status_changed.py; then
            git config user.name  "drop-watch-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ site/
            git commit -m "data: stock update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "No status changes; not committing."
          fi

      # Ping the drop-alert webhook only when there's a new in-stock change (or a manual test).
      # URL and key live in repo secrets; never in code. A failed ping never fails the run.
      - name: Ping drop-alert webhook
        if: steps.fresh.outputs.count != '0' || inputs.test_ping
        continue-on-error: true
        env:
          DROP_WEBHOOK_URL: ${{ secrets.DROP_WEBHOOK_URL }}
          DROP_WEBHOOK_KEY: ${{ secrets.DROP_WEBHOOK_KEY }}
          TEST_PING: ${{ inputs.test_ping && 'true' || 'false' }}
        run: |
          if [ -z "$DROP_WEBHOOK_URL" ] || [ -z "$DROP_WEBHOOK_KEY" ]; then
            echo "::notice::Drop webhook secrets not set; skipping ping."; exit 0
          fi
          python scripts/new_in_stock.py --webhook /tmp/new_in_stock.json /tmp/ping.json
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 -X POST "$DROP_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DROP_WEBHOOK_KEY" \
            -H "X-Automation-Key: $DROP_WEBHOOK_KEY" \
            --data @/tmp/ping.json)
          echo "Webhook responded HTTP $code"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Backup only: the live site is served by Cloudflare Pages (cloudflare-pages.yml).
    # A failed GitHub Pages deploy must not mark the run as failed or send failure emails.
    needs: check
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
