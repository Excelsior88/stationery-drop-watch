name: Check stock and deploy site

on:
  schedule:
    - cron: "17,47 * * * *"  # twice an hour, off the busy :00 slot (GitHub was dropping most :00 runs)
  workflow_dispatch:
    inputs:
      test_ping:
        description: "Send a test in-stock ping to the drop-alert webhook (no real alert)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write    # commit data/ changes
  pages: write       # upload the site artifact Cloudflare Pages deploys
  id-token: write

# One checker at a time on main. Do not cancel in-progress runs: they may
# already be committing a stock update. Waiting is not enough on its own,
# because checkout uses the SHA from when the run was triggered. A queued run
# therefore resets to the latest origin/main before it reads the old data, and
# if a push is still rejected it rebuilds on the new main instead of merging
# data/stock.json (a JSON rebase conflict used to fail the run about once a day).
concurrency:
  group: drop-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The checked-out SHA is the one from when this run was queued. Start from
      # the newest main so the checker compares against the latest stock data.
      - name: Start from the latest main
        run: |
          git fetch --no-tags --depth=1 origin main
          git reset --hard origin/main
          echo "Starting from $(git rev-parse --short HEAD)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Same polite checker as local: robots.txt respected, 2.5 s/host, one worker per host.
      - name: Run stock checker
        run: python scripts/checker.py

      # Limited-edition inks: same polite fetcher, separate files (data/inks/). Real status changes to in_stock
      # also go to the drop-alert webhook (new_in_stock.py, tracker=inks); first observations never do. A failed
      # ink run must not stop the stock deploy; the page then shows the last committed ink check.
      - name: Run ink checker
        continue-on-error: true
        run: python scripts/ink_tracker.py check

      - name: Build site
        run: python scripts/build_site.py

      # Find this run's new in_stock changes before the commit moves HEAD.
      - name: Collect new in-stock changes
        id: fresh
        run: echo "count=$(python scripts/new_in_stock.py /tmp/new_in_stock.json)" >> "$GITHUB_OUTPUT"

      - name: Commit data changes (skip timestamp-only updates)
        run: |
          if python scripts/status_changed.py; then
            git config user.name  "drop-watch-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ site/
            git commit -m "data: stock update $(date -u +%Y-%m-%dT%H:%MZ)"
            # This run's results. On a rejected push they are written onto the new
            # main and the site is rebuilt there, so JSON is never merged or rebased.
            results=$(mktemp -d)
            cp data/stock.json data/changes.json "$results/"
            cp data/robots-blocks.json "$results/" 2>/dev/null || true
            mkdir -p "$results/inks"
            cp data/inks/stock.json data/inks/changes.json data/inks/retired.json "$results/inks/" 2>/dev/null || true
            for i in 1 2 3 4 5; do
              if git_push_out=$(git push origin HEAD:main 2>&1); then
                echo "$git_push_out"
                break
              fi
              echo "$git_push_out"
              if ! echo "$git_push_out" | grep -Eq 'fetch first|non-fast-forward|\[rejected\]'; then
                exit 1
              fi
              if [ "$i" -eq 5 ]; then
                echo "git push failed after 5 attempts"
                exit 1
              fi
              echo "Push rejected (attempt $i); rewriting this run's data on the latest main"
              git fetch --no-tags --depth=1 origin main
              git reset --hard origin/main
              cp "$results/stock.json" "$results/changes.json" data/
              if [ -f "$results/robots-blocks.json" ]; then cp "$results/robots-blocks.json" data/; fi
              if ls "$results/inks/"*.json >/dev/null 2>&1; then mkdir -p data/inks && cp "$results/inks/"*.json data/inks/; fi
              python scripts/build_site.py
              if ! python scripts/status_changed.py; then
                echo "Latest main already has these statuses; nothing to push."
                break
              fi
              git add data/ site/
              git commit -m "data: stock update $(date -u +%Y-%m-%dT%H:%MZ)"
            done
          else
            echo "No status changes; not committing."
          fi

      # Ping the drop-alert webhook only when there's a new in-stock change (or a manual test).
      # URL and key live in repo secrets; never in code. A failed ping never fails the run.
      - name: Ping drop-alert webhook
        if: steps.fresh.outputs.count != '0' || inputs.test_ping
        continue-on-error: true
        env:
          DROP_WEBHOOK_URL: ${{ secrets.DROP_WEBHOOK_URL }}
          DROP_WEBHOOK_KEY: ${{ secrets.DROP_WEBHOOK_KEY }}
          TEST_PING: ${{ inputs.test_ping && 'true' || 'false' }}
        run: |
          if [ -z "$DROP_WEBHOOK_URL" ] || [ -z "$DROP_WEBHOOK_KEY" ]; then
            echo "::notice::Drop webhook secrets not set; skipping ping."; exit 0
          fi
          python scripts/new_in_stock.py --webhook /tmp/new_in_stock.json /tmp/ping.json
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 -X POST "$DROP_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DROP_WEBHOOK_KEY" \
            -H "X-Automation-Key: $DROP_WEBHOOK_KEY" \
            --data @/tmp/ping.json)
          echo "Webhook responded HTTP $code"

      # Site artifact for "Deploy to Cloudflare Pages" (download name: github-pages).
      # GitHub Pages is not published from this workflow. The old publish step only updated
      # excelsior88.github.io/stationery-drop-watch/, which 301-redirects to stationerydropwatch.com.
      # That step did not build this artifact, and neither this workflow nor cloudflare-pages.yml
      # reads a GitHub Pages deployment. configure-pages stays because the artifact upload expects
      # it, and Cloudflare deploys this artifact.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
