name: Ink discovery (daily)

# Once a day: scan the verified ink shops' public catalogs for new limited inks (scripts/ink_tracker.py discover).
# Writes only data/inks/discovery.json, pending.json and new_finds.json. New finds stay hidden from the site until
# the owner approves them; new_finds.json "note" is non-empty only on days with finds. Sends nothing.
# The check-and-deploy workflow never writes these three files, so a rebase onto its data commits can't conflict.

on:
  schedule:
    - cron: "23 11 * * *"   # 6:23 AM EST / 7:23 AM EDT, off the checker's :17 and :47 slots
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ink-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Start from the latest main
        run: |
          git fetch --no-tags --depth=1 origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan catalogs
        run: python scripts/ink_tracker.py discover
      - name: Commit discovery results
        run: |
          git add data/inks/discovery.json data/inks/pending.json data/inks/new_finds.json
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git config user.name  "drop-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: ink discovery $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch --no-tags origin main
            git rebase origin/main
          done
          echo "push failed after 5 attempts"; exit 1
