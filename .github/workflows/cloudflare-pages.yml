name: Deploy to Cloudflare Pages

# Publishes only the site artifact from a successful "Check stock and deploy site" run on main.
# Direct Upload, so Cloudflare does not rebuild the site. A failed, missing, or corrupt artifact
# is not replaced with checked-in data/ or site/. Manual dispatch fails closed.
# Inert until both repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist: the job
# prints a notice and succeeds. Schedules stay on the checker workflow. GitHub Pages is untouched.

on:
  workflow_run:
    workflows: ["Check stock and deploy site"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read        # download the artifact from the triggering run
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

env:
  CF_PROJECT: stationery-drop-watch

jobs:
  deploy:
    # A failed or skipped checker run must not reach the deploy steps. Manual dispatch is
    # failed inside the guard, because it has no checker artifact.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping Cloudflare Pages deploy."
          fi

      # Workflow files and the Cloudflare headers only. The site itself is the checker artifact.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - name: Require a successful main checker run
        if: success() && steps.gate.outputs.enabled == 'true'
        env:
          DEPLOY_EVENT: ${{ github.event_name }}
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          DEPLOY_RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          DEPLOY_RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: python scripts/require_fresh_pages_artifact.py preflight

      - name: Download site artifact from the checker run
        if: success() && steps.gate.outputs.enabled == 'true' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Require a fresh checker artifact
        if: success() && steps.gate.outputs.enabled == 'true'
        env:
          DEPLOY_EVENT: ${{ github.event_name }}
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          DEPLOY_RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          DEPLOY_RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: python scripts/require_fresh_pages_artifact.py accept artifact/artifact.tar out

      - name: Add Cloudflare-only config (_redirects, _headers)
        if: success() && steps.gate.outputs.enabled == 'true'
        run: |
          cp cloudflare/_redirects cloudflare/_headers out/
          test -f out/index.html && test -f out/404.html && test -f out/data/stock.json
          ls -la out

      - uses: actions/setup-node@v4
        if: success() && steps.gate.outputs.enabled == 'true'
        with:
          node-version: "22"

      - name: Create Pages project if missing
        if: success() && steps.gate.outputs.enabled == 'true'
        run: |
          if npx --yes wrangler@4 pages project list --json | grep -q "\"$CF_PROJECT\""; then
            echo "Project $CF_PROJECT exists."
          else
            npx --yes wrangler@4 pages project create "$CF_PROJECT" --production-branch=main
          fi

      - name: Deploy (Direct Upload)
        if: success() && steps.gate.outputs.enabled == 'true'
        run: |
          npx --yes wrangler@4 pages deploy out \
            --project-name="$CF_PROJECT" --branch=main \
            --commit-hash="${{ github.event.workflow_run.head_sha }}" --commit-dirty=true
